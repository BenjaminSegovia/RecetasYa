server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:recetaya}
    password: ${SPRING_DATASOURCE_PASSWORD:recetaya123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Misma clave que en auth-service, para poder validar el JWT que llega.
jwt:
  secret: ${JWT_SECRET:recetasyaduocclantoniovaras12345678}

# Cola SQS apuntando a LocalStack mientras se desarrolla en local.
aws:
  sqs:
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
    region: us-east-1
    queue-name: reserva-stock-queue

# URL de receta-service, para avisarle cuando una receta queda reservada.
receta-service:
  base-url: ${RECETA_SERVICE_URL:http://localhost:8082}