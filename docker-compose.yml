services:

  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: recetaya
      POSTGRES_PASSWORD: recetaya123
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  receta-db:
    image: postgres:16
    container_name: receta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: receta_db
      POSTGRES_USER: recetaya
      POSTGRES_PASSWORD: recetaya123
    ports:
      - "5434:5432"
    volumes:
      - receta-db-data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16
    container_name: inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: recetaya
      POSTGRES_PASSWORD: recetaya123
    ports:
      - "5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

  dispensing-db:
    image: postgres:16
    container_name: dispensing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dispensing_db
      POSTGRES_USER: recetaya
      POSTGRES_PASSWORD: recetaya123
    ports:
      - "5436:5432"
    volumes:
      - dispensing-db-data:/var/lib/postgresql/data

  # LocalStack: emula SQS localmente para no depender de una cuenta AWS
  # mientras se desarrolla y prueba en el equipo.
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    restart: unless-stopped
    environment:
      - SERVICES=sqs
      - DEBUG=1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      - auth-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: recetaya
      SPRING_DATASOURCE_PASSWORD: recetaya123
      JWT_SECRET: recetasyaduocclantoniovaras12345678
    ports:
      - "8081:8081"

  receta-service:
    build: ./receta-service
    container_name: receta-service
    restart: unless-stopped
    depends_on:
      - receta-db
      - localstack
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://receta-db:5432/receta_db
      SPRING_DATASOURCE_USERNAME: recetaya
      SPRING_DATASOURCE_PASSWORD: recetaya123
      JWT_SECRET: recetasyaduocclantoniovaras12345678
      AWS_SQS_ENDPOINT: http://localstack:4566
    ports:
      - "8082:8082"

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    restart: unless-stopped
    depends_on:
      - inventory-db
      - localstack
      - receta-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: recetaya
      SPRING_DATASOURCE_PASSWORD: recetaya123
      JWT_SECRET: recetasyaduocclantoniovaras12345678
      AWS_SQS_ENDPOINT: http://localstack:4566
      RECETA_SERVICE_URL: http://receta-service:8082
    ports:
      - "8083:8083"

  dispensing-service:
    build: ./dispensing-service
    container_name: dispensing-service
    restart: unless-stopped
    depends_on:
      - dispensing-db
      - receta-service
      - inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dispensing-db:5432/dispensing_db
      SPRING_DATASOURCE_USERNAME: recetaya
      SPRING_DATASOURCE_PASSWORD: recetaya123
      JWT_SECRET: recetasyaduocclantoniovaras12345678
      RECETA_SERVICE_URL: http://receta-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
    ports:
      - "8084:8084"

volumes:
  auth-db-data:
  receta-db-data:
  inventory-db-data:
  dispensing-db-data:
  localstack-data:
